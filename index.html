<style>
:root{--bg:#fff4dc;--dot:rgba(90,70,150,.3);--card:#ffffff;--tx:#2b2250;--mu:#5a5180;--ink:#2b2250;--sh:#2b2250;--ac:#7c4dff;--ok:#0f9d76;--bad:#e5484d;--c1:#ffb3c7;--c2:#a8dcff;--c3:#ffe27a;--c4:#b6f0c4;--m1:#2dc98f;--m2:#ff5fa0;--m3:#3d85ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1538;--dot:rgba(200,180,255,.24);--card:#2a2150;--tx:#f6efff;--mu:#c3b6ea;--ink:#a794f0;--sh:#0d0820;--ac:#a58bff;--ok:#43d9a8;--bad:#ff7a80;--c1:#5a2d63;--c2:#27476f;--c3:#5e4f1e;--c4:#2a5a45;--m1:#43d9a8;--m2:#ff8fbd;--m3:#7aa8ff}}
:root[data-theme="dark"]{--bg:#1c1538;--dot:rgba(200,180,255,.24);--card:#2a2150;--tx:#f6efff;--mu:#c3b6ea;--ink:#a794f0;--sh:#0d0820;--ac:#a58bff;--ok:#43d9a8;--bad:#ff7a80;--c1:#5a2d63;--c2:#27476f;--c3:#5e4f1e;--c4:#2a5a45;--m1:#43d9a8;--m2:#ff8fbd;--m3:#7aa8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:var(--bg) radial-gradient(circle at 1px 1px,var(--dot) 1.6px,transparent 0) 0 0/22px 22px;font:17px/1.5 "Fredoka","Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:40px;line-height:1.05;margin:8px 0 14px;color:var(--ac);font-weight:700}
@supports ((-webkit-background-clip:text) or (background-clip:text)){h1 .g{background:linear-gradient(90deg,#ff5fa0,#ffb000,#2dc98f,#3d85ff,#7c4dff,#ff5fa0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}h1{animation:bob 3s ease-in-out infinite}}
p{margin:0 0 12px}
.mu{color:var(--mu)}.sm{font-size:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--sh);padding:16px;margin-bottom:18px;animation:bounceIn .75s cubic-bezier(.2,.9,.3,1.2) backwards}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.meters>div{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--sh);padding:8px 9px}
.meters>div:nth-child(1){animation:bounceIn .6s .0s cubic-bezier(.2,.9,.3,1.2) backwards}
.meters>div:nth-child(2){animation:bounceIn .6s .1s cubic-bezier(.2,.9,.3,1.2) backwards}
.meters>div:nth-child(3){animation:bounceIn .6s .2s cubic-bezier(.2,.9,.3,1.2) backwards}
.meters>div.upb{animation:bumpUp .9s ease}
.meters>div.dnb{animation:bumpDn .8s ease}
.mt{font-size:12px;font-weight:600;color:var(--tx);white-space:nowrap}
.bar{height:14px;background:rgba(125,110,190,.25);border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background-color:var(--ac);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 8px,transparent 8px 16px);background-size:22px 22px;border-radius:99px;transition:width 1.2s cubic-bezier(.34,1.56,.64,1);animation:stripes 1s linear infinite}
.meters>div:nth-child(1) .bar i{background-color:var(--m1)}
.meters>div:nth-child(2) .bar i{background-color:var(--m2)}
.meters>div:nth-child(3) .bar i{background-color:var(--m3)}
.bar.low i{background-color:var(--bad)!important}
.bar.low{animation:wob .4s ease-in-out infinite alternate}
button{font:inherit;font-weight:500;color:var(--tx);background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:14px 16px;width:100%;text-align:left;margin-bottom:14px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
button:nth-of-type(odd){animation:slideL .65s cubic-bezier(.2,.9,.3,1.2) backwards}
button:nth-of-type(even){animation:slideR .65s cubic-bezier(.2,.9,.3,1.2) backwards}
button:nth-of-type(2){animation-delay:.08s}button:nth-of-type(3){animation-delay:.16s}button:nth-of-type(4){animation-delay:.24s}button:nth-of-type(5){animation-delay:.32s}button:nth-of-type(6){animation-delay:.4s}button:nth-of-type(7){animation-delay:.48s}
button:nth-of-type(4n+1){background:var(--c1)}
button:nth-of-type(4n+2){background:var(--c2)}
button:nth-of-type(4n+3){background:var(--c3)}
button:nth-of-type(4n+4){background:var(--c4)}
button:hover{transform:translate(-3px,-4px) rotate(-.8deg) scale(1.02);box-shadow:8px 8px 0 var(--sh)}
button:active{transform:translate(3px,3px) scale(.97);box-shadow:1px 1px 0 var(--sh)}
button.pri,#an{display:block;width:100%;margin-left:0;margin-right:0;rotate:0deg}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
.modes button{margin:0;min-height:96px;text-align:center;font-size:18px;padding:12px 10px}
.modes button small{font-size:13px;margin-top:4px}
.modes button[data-m="Story"]{grid-column:1/-1;order:-1;min-height:88px;font-size:21px;background:var(--ac);color:#fff}
.modes button[data-m="Story"] small{color:#fff}
button.pri{background:var(--ac);color:#fff;font-weight:700;font-size:19px;text-align:center;animation:bounceIn .75s cubic-bezier(.2,.9,.3,1.2) backwards,jiggle 3.2s ease-in-out 1.4s infinite}
button.pri:hover{animation:none}
button small{display:block;color:var(--mu);font-weight:400;font-size:14px}
.fb{border-left:6px solid var(--ac);background:rgba(124,77,255,.12);border-radius:0 12px 12px 0;padding:10px 12px;margin:12px 0;animation:rise .6s .25s ease backwards}
.d{font-size:16px;font-weight:700}
.up,.dn{display:inline-block;font-weight:700;animation:popBig .9s cubic-bezier(.3,1.8,.5,1) backwards}
.up{color:var(--ok)}.dn{color:var(--bad)}
.step{font-size:14px;font-weight:600;color:var(--mu);margin-bottom:10px;display:flex;justify-content:space-between}
.pill{display:inline-block;background:var(--c3);color:var(--tx);border:2px solid var(--ink);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600;margin:0 6px 6px 0;animation:popBig .8s cubic-bezier(.3,1.8,.5,1) backwards}
.ev{color:var(--bad);font-weight:700}.gd{color:var(--ok);font-weight:700}
summary{cursor:pointer}
.sup{display:block;text-align:center;margin:6px 0 14px;font-weight:600;color:var(--ac);text-decoration:none;border:3px dashed var(--ink);border-radius:18px;padding:12px}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
.shake{animation:shake .7s}
@keyframes bounceIn{0%{opacity:0;transform:scale(.5) rotate(-6deg) translateY(50px)}60%{opacity:1;transform:scale(1.07) rotate(1.5deg)}100%{transform:none}}
@keyframes slideL{0%{opacity:0;transform:translateX(-90px) rotate(-4deg)}65%{transform:translateX(10px) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes slideR{0%{opacity:0;transform:translateX(90px) rotate(4deg)}65%{transform:translateX(-10px) rotate(-1deg)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popBig{0%{opacity:0;transform:scale(0) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes jiggle{0%,68%,100%{transform:none}72%{transform:rotate(-3deg) scale(1.05)}77%{transform:rotate(3deg) scale(1.05)}82%{transform:rotate(-2deg)}87%{transform:rotate(2deg)}}
@keyframes bumpUp{0%{transform:none}30%{transform:scale(1.2) rotate(-3deg)}60%{transform:scale(.96) rotate(1.5deg)}100%{transform:none}}
@keyframes bumpDn{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-12px) rotate(-1deg)}30%{transform:translateX(10px) rotate(1deg)}45%{transform:translateX(-8px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes stripes{to{background-position:22px 0}}
@keyframes shine{to{background-position:300% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wob{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<main id="app"></main>
<script>
// o = [text, [wellbeing, relationships, progress], style tag, feedback, optional ripple id]
var S=[
{t:"A friend invites you out tonight. Tomorrow you have something important to finish.",o:[
["Go for an hour, then head home and work.",[2,6,-2],"C","A good balance, and a slightly shorter night."],
["Stay in and work. There will be other nights.",[-6,-8,10],"D","Progress is safe, but your friend notices a pattern."],
["Go all night and deal with tomorrow later.",[8,6,-14],"P","A great night, and a problem waiting for you.","cram"]]},
{t:"You get a job offer with much higher pay, in a city far from your family.",o:[
["Take it. This is the chance.",[-4,-12,14],"D","Big step forward, and a quieter phone on Sundays."],
["Negotiate for a hybrid or remote option.",[-3,4,3],"C","Takes courage, and the outcome is uncertain."],
["Decline and stay close to home.",[4,10,-8],"P","Warm and stable, and you wonder “what if” sometimes."]]},
{t:"You are tired all the time, even after sleeping.",o:[
["Take a real weekend off, with no tasks.",[12,2,-8],"C","Rest works, and some things have to wait."],
["Push through. You will rest when this is done.",[-12,-4,10],"D","Output holds for now, and your body keeps the bill.","crash"],
["Scroll and binge shows to switch off.",[2,-2,-6],"A","It feels like rest and does not restore much."]]},
{t:"A close friend made a hurtful comment in front of others.",o:[
["Tell them calmly later that it hurt.",[-2,10,0],"C","Uncomfortable, and it keeps the friendship honest.","mend"],
["Say it is fine and swallow it.",[-6,-4,0],"P","Peaceful today, and it sits inside you.","resent"],
["Quietly spend less time with them.",[2,-12,2],"A","No conflict, and the friendship fades without a word."]]},
{t:"You have had a project idea for years and never started it.",o:[
["Start with 30 minutes a day.",[-3,0,10],"C","Small steps. It is slow but real.","spark"],
["Wait until you have more time and money.",[2,2,-8],"A","Comfortable, and the idea stays in a drawer."],
["Quit everything and go all in.",[-10,-8,14],"D","Bold. The upside is huge, and so is the stress."]]},
{t:"A relative keeps asking for favors, and you are running out of energy.",o:[
["Set a kind, clear limit.",[6,-2,4],"C","A bit of guilt, then a lot of breathing room.","space"],
["Say yes to everything to keep the peace.",[-10,6,-6],"P","Everyone is happy except you.","resent"],
["Stop answering their calls.",[4,-10,0],"A","Instant relief, and a bigger issue later.","dist"]]},
{t:"Your roommate or partner is not doing their share at home.",o:[
["Raise it with specific examples and ask what would help.",[-2,6,4],"C","Awkward for ten minutes, and things improve."],
["Keep doing it all yourself.",[-8,-4,4],"P","The house is clean, and you are not happy."],
["Leave passive-aggressive notes.",[-2,-10,2],"A","The dishes get done, but the mood does not."]]},
{t:"A friend asks to borrow a significant amount of money.",o:[
["Lend a small amount you can afford to lose.",[-2,8,-4],"P","A fair compromise, and you have to let go of the money."],
["Say no kindly and offer other help.",[4,-2,4],"C","Your finances are safe, and the friend may feel let down."],
["Lend the full amount. They are a friend.",[-8,6,-10],"P","Generous, and now it sits between you."]]},
{t:"Someone you know just posted a big success. You feel a pang.",o:[
["Congratulate them, then look at your own plan.",[4,6,2],"C","You turn envy into direction."],
["Scroll for an hour comparing yourself.",[-10,-2,-4],"A","The pang grows and nothing changes.","scroll"],
["Work harder to prove yourself.",[-8,-4,10],"D","Fuel for progress, at a personal cost."]]},
{t:"You just moved to a new city and you do not know anyone.",o:[
["Join a class or club, even if it feels awkward.",[-2,10,4],"C","Awkward at first, and it opens doors.","tribe"],
["Wait for people to reach out.",[-4,-8,0],"A","Waiting is quiet, and so is the apartment."],
["Throw yourself into work.",[-2,-6,10],"D","Great for progress, lonely for everything else."]]},
{t:"You keep postponing a health check-up.",o:[
["Book it today.",[6,0,-3],"C","One small task, a lot of peace of mind.","relief"],
["Plan to do it next month.",[-2,0,2],"A","Easy today, and next month is the same story.","skip"],
["Search symptoms online for hours.",[-8,-2,-4],"A","More anxiety, not more answers."]]},
{t:"You made a big mistake at work or school and it might be noticed.",o:[
["Own it and suggest a fix.",[-3,6,6],"C","A short sting and a long-term gain in trust.","trust"],
["Hide it and hope no one notices.",[-8,-8,2],"A","The stress follows you around.","found"],
["Explain it as someone else’s fault.",[-2,-8,2],"D","You avoid the heat, and people remember it."]]},
{t:"You have a completely free weekend with no obligations.",o:[
["See friends or family, and let the plans be simple.",[4,8,-2],"C","Warm and connecting. Your to-do list can wait."],
["Catch up on chores and long-term goals.",[-4,0,8],"D","Productive, and you may feel like you worked all weekend."],
["Do absolutely nothing.",[8,-2,-2],"A","Restful, and a bit empty if it becomes a habit."]]},
{t:"Someone you admire offers to mentor you, but it will take real time.",o:[
["Accept and make time for it.",[-4,4,10],"C","A busy few months for a big long-term gain."],
["Politely decline because you are too busy.",[4,-2,-6],"A","Your schedule stays calm, and the chance passes."],
["Accept, then rarely follow up.",[-2,-4,-2],"P","It is nice in theory, and they notice the silence."]]},
{t:"You receive an unexpected bonus or a gift of money.",o:[
["Save most of it and treat yourself a little.",[4,0,6],"C","Sensible, and you still enjoy a part of it."],
["Take a trip with friends.",[8,8,-8],"P","Memories for life and a lighter wallet."],
["Put it all into a risky idea.",[-8,-2,12],"D","Big upside, and a lot of sleepless nights."]]},
{t:"Your family expects you to spend the holidays together, but you badly need rest.",o:[
["Go and enjoy it, and skip your own plans.",[-2,8,-4],"P","Everyone is happy, and you are tired."],
["Visit for a day and explain you need quiet time.",[4,4,0],"C","A fair balance, and you may need to explain it twice."],
["Skip it and tell them at the last minute.",[4,-10,0],"A","You rest, and they are hurt by how it was done."]]},
{t:"Your routine feels dull and you feel stuck.",o:[
["Change one small thing this week.",[4,2,4],"C","Small shifts add up to momentum."],
["Make a drastic change, like a new job or city.",[-6,-4,10],"D","Exciting and risky. It could work out well."],
["Wait until motivation shows up.",[-6,0,-6],"A","Motivation is a late guest."]]},
{t:"You see someone being treated unfairly in front of you.",o:[
["Speak up calmly in the moment.",[-3,6,2],"C","Brave, and it shows people what is acceptable."],
["Stay quiet and hope it passes.",[-6,-4,0],"A","It passes, and the feeling stays."],
["Check in with them privately afterwards.",[2,6,0],"P","Kind and safe, though the moment is gone."]]},
{t:"There is a sale on something you do not really need.",o:[
["Wait 48 hours before deciding.",[2,0,4],"C","Most impulses fade, and some real needs stay."],
["Buy it now. It is a bargain.",[4,0,-6],"A","A quick lift and a thinner wallet."],
["Buy it as a gift for someone.",[2,6,-4],"P","Generous, and a bit of an excuse."]]},
{t:"Someone you like asks you out, and you are nervous.",o:[
["Say yes.",[-2,10,-2],"C","Nerves, and a real chance at something good."],
["Suggest a casual coffee first.",[2,5,0],"C","Low pressure and easy to enjoy."],
["Say “not now” and hope they ask again.",[-4,-4,0],"A","The moment passes quietly."]]},
{t:"You have an exam in a week and a lot to learn.",o:[
["Make a daily plan and stick to it.",[-2,0,10],"C","Not exciting, and it works."],
["Study with friends.",[4,6,2],"P","Fun and social, and sometimes more chat than study."],
["Start in the last two days.",[-8,0,6],"A","It can work, and it is rough.","cram"]]},
{t:"It is midnight and you could watch one more episode.",o:[
["Go to bed.",[8,0,-2],"C","Tomorrow you will be glad."],
["Watch one more, then another.",[-8,0,-2],"A","One became three and the alarm is near.","scroll"],
["Work a bit more instead.",[-6,0,6],"D","A small gain now and a tired morning."]]},
{t:"A neighbor asks for help moving a heavy couch on your day off.",o:[
["Help for an hour.",[-2,8,-2],"P","Neighborly, and your day shrinks."],
["Offer to help another day.",[0,4,0],"C","Kind and honest about your limits."],
["Politely decline.",[4,-2,0],"C","You rest, and they find someone else."]]},
{t:"Your boss asks you to take on extra work with no extra pay.",o:[
["Say yes to stay on their good side.",[-8,2,4],"P","Appreciated, and now it is the norm."],
["Ask what to drop, or how it will be rewarded.",[0,-2,6],"C","A fair question that gets a real answer."],
["Say no right away.",[4,-6,-4],"D","Your time is safe, and the tone is tense."]]},
{t:"Your phone buzzes with notifications all evening.",o:[
["Mute everything for a couple of hours.",[6,-2,2],"C","Peace, and a few messages wait."],
["Check each one. You cannot help it.",[-6,2,-4],"A","Connected and scattered."],
["Delete a few apps.",[6,-4,4],"D","Drastic and effective."]]},
{t:"You started a new habit, like exercise, and missed three days.",o:[
["Restart with a smaller goal.",[4,0,4],"C","Small and sustainable."],
["Quit. You have already failed.",[-6,0,-6],"A","Three missed days are not a failure."],
["Double the effort to catch up.",[-6,0,6],"D","Intense and hard to keep up."]]},
{t:"A friend cancels plans at the last minute, again.",o:[
["Tell them it bothers you.",[-2,6,0],"C","Honest and a little awkward.","mend"],
["Say “no problem” and swallow it.",[-4,-2,0],"P","Easy now, and it builds up.","resent"],
["Stop making plans with them.",[2,-8,0],"A","Less disappointment, and less friendship."]]},
{t:"You are invited to speak or present in front of a group.",o:[
["Say yes and prepare well.",[-4,4,10],"C","Scary and rewarding."],
["Say yes, then wing it.",[-6,-2,4],"P","It could go fine, and the stress is real."],
["Decline.",[4,-2,-6],"A","Safe, and an opportunity is gone."]]},
{t:"You find a wallet on the street with cash and an ID inside.",o:[
["Return it to the address on the ID.",[2,6,-2],"C","It costs you an evening, and it feels right."],
["Hand it in at the nearest police station.",[0,2,-1],"C","Simple and responsible."],
["Keep the cash and mail the wallet back.",[-6,-4,4],"A","The money helps, and it sits on your conscience."]]},
{t:"A stray dog follows you all the way home.",o:[
["Spend a few days trying to find its owner.",[-2,6,-3],"C","Patient and kind, and a bit of a detour."],
["Adopt it right away.",[-6,4,-8],"P","A big commitment, made in a second.","",[[10,10,-2],"It turns out to be the best decision of the year.",0.5]],
["Call animal rescue and wait with it.",[2,2,0],"C","Safe for everyone."],
["Ignore it and go inside.",[0,-4,0],"A","It looks at the door for a while."]]},
{t:"Friends invite you on a surprise trip abroad. You would leave in two days.",o:[
["Say yes and pack tonight.",[-2,6,-8],"P","Impulsive and exciting.","",[[10,10,-4],"It becomes a story you tell for years.",0.6]],
["Say it is too sudden.",[4,-4,2],"A","Calm, and a bit of regret."],
["Suggest a later date.",[0,2,0],"C","Reasonable, and the moment may pass."]]},
{t:"Your friends push you to sing at karaoke night.",o:[
["Sing solo and give it everything.",[-2,8,0],"P","A brave choice.","",[[6,12,2],"You bring the house down and everyone is cheering.",0.5]],
["Sing a duet with a friend.",[2,8,0],"C","Fun and shared."],
["Politely refuse.",[2,-4,0],"A","Safe, and a bit on the sidelines."]]},
{t:"It is your best friend’s birthday and you only just remembered.",o:[
["Call and apologize sincerely.",[-2,6,0],"C","Honest, and it means more than a late gift."],
["Throw together a last-minute dinner.",[-4,10,-4],"P","Chaotic, and it is heartfelt."],
["Send a quick message as if you remembered.",[0,-6,0],"A","They can tell."]]},
{t:"You suspect your friend’s partner is not being faithful.",o:[
["Tell your friend what you saw, calmly.",[-6,4,0],"C","A hard conversation, and a true friend’s move."],
["Confront the partner first.",[-6,-2,0],"D","Direct, and it can backfire."],
["Say nothing.",[-4,-8,0],"A","It is easier now, and it weighs on you."]]},
{t:"You win a small award and everyone is clapping.",o:[
["Thank the people who helped you.",[4,8,2],"C","Generous, and it is remembered."],
["Soak it in and enjoy it.",[8,2,2],"P","You earned it."],
["Brush it off awkwardly.",[-4,-2,0],"A","The moment passes before you enjoy it."]]},
{t:"Your commute is long and boring.",o:[
["Listen to a book or podcast.",[2,0,6],"C","Time you quietly gain back."],
["Call a friend or family member.",[2,6,-2],"P","A small connection each day."],
